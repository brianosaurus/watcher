# Temporary HTTP-only vhost used while issuing the initial Let's Encrypt cert.
# Replaced by nginx-brian.biz.conf (HTTPS + redirect) once the cert exists.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name brian.biz www.brian.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 200 "brian.biz — provisioning\n";
        add_header Content-Type text/plain;
    }
}
